<p [class]="descriptionClasses()">{{ description() || t('AUTH.RESET_PASSWORD_DESCRIPTION') }}</p>

<form class="mt-4" [formGroup]="form()" (ngSubmit)="formSubmitted.emit()" novalidate>
  <div class="space-y-1.5">
    <label [class]="labelClasses()" for="new-password">
      {{ t('AUTH.NEW_PASSWORD') }}
      <span class="text-[#facc15]">*</span>
    </label>

    <div class="relative">
      <input
        id="new-password"
        [type]="showNewPassword() ? 'text' : 'password'"
        formControlName="newPassword"
        autocomplete="new-password"
        [readOnly]="isSubmitting()"
        [attr.aria-invalid]="hasError('newPassword')"
        [attr.aria-describedby]="fieldError('newPassword') ? 'new-password-error' : null"
        [class]="inputClasses(hasError('newPassword')) + ' pr-11'"
      />

      <button
        type="button"
        [class]="toggleButtonClasses()"
        [attr.aria-label]="showNewPassword() ? t('AUTH.HIDE_NEW_PASSWORD') : t('AUTH.SHOW_NEW_PASSWORD')"
        [disabled]="isSubmitting()"
        (click)="showNewPassword.set(!showNewPassword())"
      >
        @if (showNewPassword()) {
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="m3 3 18 18M9.9 5.2A9.8 9.8 0 0 1 12 5c6 0 9.5 7 9.5 7a17.2 17.2 0 0 1-3 3.9M6.5 6.5A17.2 17.2 0 0 0 2.5 12s3.5 7 9.5 7a9.9 9.9 0 0 0 4.4-1"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            />
          </svg>
        } @else {
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"
              stroke="currentColor"
              stroke-width="1.8"
            />
            <circle cx="12" cy="12" r="2.8" stroke="currentColor" stroke-width="1.8" />
          </svg>
        }
      </button>
    </div>

    @if (fieldError('newPassword')) {
      <p id="new-password-error" [class]="errorClasses()">{{ fieldError('newPassword') }}</p>
    }
  </div>

  <div class="mt-4 space-y-1.5">
    <label [class]="labelClasses()" for="confirm-password">
      {{ t('AUTH.CONFIRM_PASSWORD') }}
      <span class="text-[#facc15]">*</span>
    </label>

    <div class="relative">
      <input
        id="confirm-password"
        [type]="showConfirmPassword() ? 'text' : 'password'"
        formControlName="confirmPassword"
        autocomplete="new-password"
        [readOnly]="isSubmitting()"
        [attr.aria-invalid]="hasError('confirmPassword')"
        [attr.aria-describedby]="confirmPasswordError() ? 'confirm-password-error' : null"
        [class]="inputClasses(hasError('confirmPassword')) + ' pr-11'"
      />

      <button
        type="button"
        [class]="toggleButtonClasses()"
        [attr.aria-label]="
          showConfirmPassword() ? t('AUTH.HIDE_CONFIRM_PASSWORD') : t('AUTH.SHOW_CONFIRM_PASSWORD')
        "
        [disabled]="isSubmitting()"
        (click)="showConfirmPassword.set(!showConfirmPassword())"
      >
        @if (showConfirmPassword()) {
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="m3 3 18 18M9.9 5.2A9.8 9.8 0 0 1 12 5c6 0 9.5 7 9.5 7a17.2 17.2 0 0 1-3 3.9M6.5 6.5A17.2 17.2 0 0 0 2.5 12s3.5 7 9.5 7a9.9 9.9 0 0 0 4.4-1"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            />
          </svg>
        } @else {
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"
              stroke="currentColor"
              stroke-width="1.8"
            />
            <circle cx="12" cy="12" r="2.8" stroke="currentColor" stroke-width="1.8" />
          </svg>
        }
      </button>
    </div>

    @if (confirmPasswordError()) {
      <p id="confirm-password-error" [class]="errorClasses()">{{ confirmPasswordError() }}</p>
    }
  </div>

  <button
    type="submit"
    class="mt-5 inline-flex min-h-10 w-full items-center justify-center gap-2 rounded-md bg-[#8b070c] px-4 py-2 text-sm font-bold text-white transition-colors hover:bg-[#6f0509] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#8b070c] focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-70"
    [disabled]="submitDisabled() || isSubmitting()"
  >
    @if (isSubmitting()) {
      <span
        class="h-4 w-4 animate-spin rounded-full border-2 border-white/40 border-t-white"
        aria-hidden="true"
      ></span>
      {{ submittingLabel() || t('AUTH.UPDATING') }}
    } @else {
      {{ submitLabel() || t('COMMON.CONFIRM') }}
    }
  </button>
</form>
