spring.application.name=pokemon-tcg-backend
server.address=0.0.0.0
server.port=8080
app.name=Pokemon TCG Backend
app.description=Backend foundation for a remote Pokemon TCG implementation
app.version=${APP_VERSION:0.1.0-SNAPSHOT}
app.url=${APP_URL:http://localhost:8080}
app.dev-name=Backend Team
app.dev-email=backend@example.com

springdoc.packages-to-scan=ar.edu.utn.frc.tup.piii.controllers
springdoc.show-actuator=true
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.path=/swagger-ui.html

#spring.datasource.url=${DB_URL:jdbc:h2:file:./data/pokemondb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.url=jdbc:h2:mem:pokemon_tcg;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=create
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

management.endpoints.web.exposure.include=health,info

app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:4200,http://127.0.0.1:4200,http://192.168.*.*:4200,http://10.*.*.*:4200,http://172.*.*.*:4200}
app.websocket.allowed-origin-patterns=${APP_WEBSOCKET_ALLOWED_ORIGIN_PATTERNS:http://localhost:4200,http://127.0.0.1:4200,http://192.168.*.*:4200,http://10.*.*.*:4200,http://172.*.*.*:4200}
app.auth.refresh-cookie.name=${APP_AUTH_REFRESH_COOKIE_NAME:refreshToken}
app.auth.refresh-cookie.path=${APP_AUTH_REFRESH_COOKIE_PATH:/api/auth}
app.auth.refresh-cookie.same-site=${APP_AUTH_REFRESH_COOKIE_SAME_SITE:Lax}
app.auth.refresh-cookie.secure=${APP_AUTH_REFRESH_COOKIE_SECURE:false}
